name: CI

on:
  push:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - run: mix deps.get
      - run: mix deps.unlock --check-unused
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      # Also covers warnings in test files, and lib compiled in the test environment
      - run: mix test --warnings-as-errors
      - run: mix site.fetch
      - run: mix site.build

      # Hands _site over to the deploy job below (which runs on another machine).
      # Warning: the repository is public, so anyone can download this artifact
      # from the run page for 7 days. _site must never contain secrets!
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site
          retention-days: 7

  # The Netlify secrets are only given to this job, which only sends _site to Netlify.
  # The "test-and-build" job (mix, dependencies, content of the source repositories) never gets them.
  # main is deployed to production, any other branch of this repository (site code, not
  # the content repositories) to its own preview URL.
  deploy:
    needs: test-and-build
    # Branches only (a pushed tag must not be deployed)
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-24.04
    # Only a label, shown with a "View deployment" link to the deployed site on the
    # pull request of the branch. The secrets are repository secrets, the same for all
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    # One deploy at a time per branch
    concurrency: deploy-${{ github.ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Gets the _site built and uploaded by the test-and-build job above. By default,
      # only artifacts of the current run (hence of this commit) can be downloaded
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: _site

      # Never deploy an older commit over a newer one: if two pushes happen in a row and
      # the run of the second one finishes first, the run of the first one must fail here
      - run: |
          latest=$(git ls-remote origin "$GITHUB_REF" | cut -f1)
          [ "$latest" = "$GITHUB_SHA" ] || { echo "::error::$GITHUB_REF_NAME has a newer commit ($latest), not deploying an older one ($GITHUB_SHA)"; exit 1; }

      - id: deploy
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then bin/deploy; else bin/deploy "$GITHUB_REF_NAME"; fi
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
